# Benchmark config. bench/run.sh replaces __WORKERS__ and __PORT__ and
# starts: openresty -p <app>/ -c conf/nginx.bench.run.conf
# Production settings (code cache on, app built in init_by_lua), no access log.
worker_processes __WORKERS__;
error_log logs/error.log warn;
pid logs/openresty.pid;

env APP_ENV;
env DB_HOST;
env DB_PORT;
env DB_NAME;
env DB_USER;
env DB_PASSWORD;
env DB_POOL;

events {
    worker_connections 4096;
}

http {
    access_log off;
    default_type application/octet-stream;
    server_tokens off;
    keepalive_timeout 65;
    keepalive_requests 100000;
    client_max_body_size 1m;
    client_body_buffer_size 1m;
    client_body_temp_path tmp/client_body;
    proxy_temp_path tmp/proxy;
    fastcgi_temp_path tmp/fastcgi;
    uwsgi_temp_path tmp/uwsgi;
    scgi_temp_path tmp/scgi;

    lua_package_path "$prefix/?.lua;$prefix/?/init.lua;$prefix/lua_modules/share/lua/5.1/?.lua;$prefix/lua_modules/share/lua/5.1/?/init.lua;;";
    lua_package_cpath "$prefix/lua_modules/lib/lua/5.1/?.so;;";
    lua_code_cache on;
    lua_shared_dict crescent_limits 1m;
    lua_shared_dict crescent_jwt 1m;
    lua_shared_dict crescent_sessions 1m;

    init_by_lua_block {
        require("app")
    }

    server {
        listen 127.0.0.1:__PORT__;
        server_name _;

        location / {
            content_by_lua_block {
                require("app"):run()
            }
        }
    }
}
